<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Alphintra</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&family=Raleway:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --work-accent-rgb: 111, 160, 255; /* Alphintra blue accent */
      --glitch-pink: #ff005d;
      --glitch-cyan: #00ffcc;
      --bg-color: #030408;
    }

    body {
      margin: 0;
      overflow: hidden;
      background-color: var(--bg-color);
      color: #fff;
      font-family: 'Raleway', sans-serif;
    }

    .error-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .error-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.5rem;
      letter-spacing: 0.25em;
      margin: 0;
      text-transform: uppercase;
      font-weight: 700;
    }

    /* Glitch Effect Settings */
    .glitch {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12rem;
      font-weight: 700;
      line-height: 0.8;
      margin: 0;
      position: relative;
      color: #ffffff;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
    }

    .glitch::before,
    .glitch::after {
      content: attr(data-text);
      position: absolute;
      top: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      left: 0;
    }

    .glitch::before {
      left: 6px;
      text-shadow: -4px 0 var(--glitch-pink);
      clip: rect(24px, 9999px, 90px, 0);
      animation: glitch-anim-2 3s infinite linear alternate-reverse;
    }

    .glitch::after {
      left: -6px;
      text-shadow: -4px 0 var(--glitch-cyan);
      clip: rect(85px, 9999px, 140px, 0);
      animation: glitch-anim 2.5s infinite linear alternate-reverse;
    }

    @keyframes glitch-anim {
      0% { clip: rect(15px, 9999px, 83px, 0); }
      5% { clip: rect(122px, 9999px, 67px, 0); }
      10% { clip: rect(98px, 9999px, 11px, 0); }
      15% { clip: rect(104px, 9999px, 18px, 0); }
      20% { clip: rect(93px, 9999px, 8px, 0); }
      25% { clip: rect(40px, 9999px, 145px, 0); }
      30% { clip: rect(85px, 9999px, 98px, 0); }
      35% { clip: rect(101px, 9999px, 20px, 0); }
      40% { clip: rect(4px, 9999px, 140px, 0); }
      45% { clip: rect(69px, 9999px, 86px, 0); }
      50% { clip: rect(32px, 9999px, 53px, 0); }
      55% { clip: rect(42px, 9999px, 143px, 0); }
      60% { clip: rect(109px, 9999px, 35px, 0); }
      65% { clip: rect(24px, 9999px, 111px, 0); }
      70% { clip: rect(78px, 9999px, 107px, 0); }
      75% { clip: rect(19px, 9999px, 16px, 0); }
      80% { clip: rect(80px, 9999px, 4px, 0); }
      85% { clip: rect(118px, 9999px, 34px, 0); }
      90% { clip: rect(117px, 9999px, 92px, 0); }
      95% { clip: rect(83px, 9999px, 66px, 0); }
      100% { clip: rect(56px, 9999px, 64px, 0); }
    }

    @keyframes glitch-anim-2 {
      0% { clip: rect(65px, 9999px, 100px, 0); }
      5% { clip: rect(52px, 9999px, 74px, 0); }
      10% { clip: rect(79px, 9999px, 85px, 0); }
      15% { clip: rect(75px, 9999px, 5px, 0); }
      20% { clip: rect(67px, 9999px, 61px, 0); }
      25% { clip: rect(14px, 9999px, 79px, 0); }
      30% { clip: rect(1px, 9999px, 66px, 0); }
      35% { clip: rect(86px, 9999px, 30px, 0); }
      40% { clip: rect(23px, 9999px, 98px, 0); }
      45% { clip: rect(85px, 9999px, 72px, 0); }
      50% { clip: rect(71px, 9999px, 75px, 0); }
      55% { clip: rect(2px, 9999px, 48px, 0); }
      60% { clip: rect(30px, 9999px, 16px, 0); }
      65% { clip: rect(59px, 9999px, 50px, 0); }
      70% { clip: rect(41px, 9999px, 62px, 0); }
      75% { clip: rect(2px, 9999px, 82px, 0); }
      80% { clip: rect(47px, 9999px, 73px, 0); }
      85% { clip: rect(3px, 9999px, 27px, 0); }
      90% { clip: rect(26px, 9999px, 55px, 0); }
      95% { clip: rect(42px, 9999px, 97px, 0); }
      100% { clip: rect(38px, 9999px, 49px, 0); }
    }

    /* Original site button style */
    .our-work-card__button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      margin-top: 15px;
      padding: 0 24px;
      border-radius: 999px;
      border: 1px solid rgba(var(--work-accent-rgb), 0.46);
      background: rgba(var(--work-accent-rgb), 0.15);
      color: rgba(241, 247, 255, 0.95);
      text-decoration: none;
      font-family: inherit;
      font-weight: 700;
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      cursor: pointer;
      touch-action: manipulation;
      pointer-events: auto;
      transition: border-color 0.22s ease, background-color 0.22s ease, color 0.22s ease;
    }

    .our-work-card__button:hover {
      border-color: rgba(var(--work-accent-rgb), 0.78);
      background: rgba(var(--work-accent-rgb), 0.28);
      color: #fff;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      display: block;
      width: 100vw;
      height: 100vh;
      opacity: 0.9;
      pointer-events: none;
    }
  </style>
</head>
<body>
  
  <div class="error-container">
    <h2 class="error-text">ERROR!</h2>
    <h1 class="glitch" data-text="404">404</h1>
    <h2 class="error-text">PAGE NOT FOUND</h2>
    <a href="/index.html" class="our-work-card__button">RETURN TO HOME</a>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r68/three.min.js"></script>
  <script>
    var scene = new THREE.Scene();
    var camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 10000);
    var renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });

    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Using basic white lines for the hologram aesthetic
    var faceMesh;
    var loader = new THREE.JSONLoader();
    loader.load('/app/public/3D/face-hp.js', function (geometry) {
      
      // The user requested white lines for the 3D model - upgrading to Additive Blending for a perfect hologram wireframe look
      var material = new THREE.MeshBasicMaterial({
        color: 0xffffff,
        wireframe: true,
        transparent: true,
        opacity: 0.15,
        blending: THREE.AdditiveBlending // This makes intersecting lines glow perfectly instead of looking like a solid clustered mess
      });

      faceMesh = new THREE.Mesh(geometry, material);
      
      // Exact scaling used in the main site's FaceHpObject3D
      faceMesh.scale.x = 1.5;
      faceMesh.scale.y = 1.5;
      faceMesh.scale.z = 1.5;
      
      // Let the model's natural origin dictate its placement, matching the rest of the site geometry perfectly
      faceMesh.position.set(0, -2, 0); 
      
      scene.add(faceMesh);
    });

    // Exact camera Z distance used in the main site targetCameraZ
    camera.position.z = 40;

    var clock = new THREE.Clock();

    function render() {
      requestAnimationFrame(render);
      var time = clock.getElapsedTime();

      if (faceMesh) {
        // Sway exactly like the main site's idletween (between -0.2 and 0.2 on Y)
        faceMesh.rotation.y = Math.sin(time) * 0.2;
        // Minor X movement to make it float seamlessly
        faceMesh.rotation.x = Math.sin(time * 0.8) * 0.05;
      }

      renderer.render(scene, camera);
    }
    render();

    window.addEventListener('resize', function() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
